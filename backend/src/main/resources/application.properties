spring.application.name=backend

# ===== MySQL =====
# NOTE: adjust username/password to match your local MySQL install
spring.datasource.url=jdbc:mysql://localhost:3306/blog_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=0000

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ===== Server / Session =====
server.servlet.session.timeout=60m
server.servlet.session.cookie.same-site=lax
